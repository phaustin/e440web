services:
  e440web:
    image: nginx:alpine
    container_name: e440web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - traefik.http.routers.e440web.rule=Host(`dashboard.eoas.ubc.ca`) && (Path(`/e440`) || PathPrefix(`/e440/`))
      - traefik.http.routers.e440web.tls=true
      - traefik.http.routers.e440web.service=e440web
      - "traefik.http.services.e440web.loadbalancer.server.port=80"
      - "traefik.http.middlewares.e440-strip.stripprefix.prefixes=/e440"
      - "traefik.http.routers.e440web.middlewares=e440-strip"
     
    networks:
      - proxy_aug07

networks:
  proxy_aug07:
    external: true
