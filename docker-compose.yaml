services:
  nginx:
    image: nginx:alpine
    container_name: e440web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.e440web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.e440web.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      # Uncomment if Traefik has a TLS cert resolver configured:
      # - "traefik.http.routers.e440web.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.e440web.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
