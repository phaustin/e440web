server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik strips /e440 before requests arrive, so nginx must never issue
    # its own redirects (they would lose the /e440 prefix and https).
    absolute_redirect off;

    location / {
        # MyST pages are folders: /lectures -> /lectures/index.html.
        # Serve the file directly instead of 301-redirecting to /lectures/.
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
